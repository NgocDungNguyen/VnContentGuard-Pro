<body>

    <script>
        const params = new URLSearchParams(window.location.search);

        // Support both ?url= (old) and ?blockedUrl= (new from 6.2/6.6)
        const targetUrl = params.get('blockedUrl') || params.get('url') || '';
        const risk      = params.get('risk') || '';
        const reason    = params.get('reason') || 'risk'; // 'risk' | 'blacklist' | 'incognito'

        // â”€â”€ Display domain â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        try {
            const domain = new URL(targetUrl).hostname.replace('www.', '');
            document.getElementById('domainDisplay').textContent = domain;
        } catch {
            document.getElementById('domainDisplay').textContent = targetUrl.substring(0, 60) || '(Trang khĂ´ng xĂ¡c Ä‘á»‹nh)';
        }

        // â”€â”€ Customise UI per reason â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        const container = document.getElementById('blockContainer');
        const icon      = document.getElementById('blockIcon');
        const title     = document.getElementById('blockTitle');
        const msg       = document.getElementById('blockMsg');
        const badge     = document.getElementById('reasonBadge');

        if (reason === 'blacklist') {
            icon.textContent  = 'đŸ«';
            title.textContent = 'đŸ« TRANG Bá» CHáº¶N Bá»I PHá»¤ HUYNH';
            msg.textContent   = 'TĂªn miá»n nĂ y náº±m trong danh sĂ¡ch Ä‘en cá»§a Kiá»ƒm soĂ¡t gia Ä‘Ă¬nh. '
                              + 'Náº¿u báº¡n nghÄ© Ä‘Ă¢y lĂ  nháº§m láº«n, hĂ£y nháº­p mĂ£ PIN Ä‘á»ƒ tiáº¿p tá»¥c.';
            badge.textContent = 'đŸ« Danh sĂ¡ch Ä‘en';
            badge.className   = 'reason-badge reason-blacklist';

        } else if (reason === 'incognito') {
            icon.textContent  = 'đŸ•µï¸';
            title.textContent = 'đŸ•µï¸ CHáº¾ Äá»˜ áº¨N DANH Bá» Háº N CHáº¾';
            msg.textContent   = 'Phá»¥ huynh Ä‘Ă£ táº¯t cháº¿ Ä‘á»™ duyá»‡t web áº©n danh. '
                              + 'Vui lĂ²ng sá»­ dá»¥ng cá»­a sá»• duyá»‡t thĂ´ng thÆ°á»ng.';
            badge.textContent = 'đŸ•µï¸ áº¨n danh bá»‹ cháº·n';
            badge.className   = 'reason-badge reason-incognito';
            container.classList.add('incognito-mode');

        } else {
            // Default: risk-based parental block
            badge.textContent = risk ? `Rá»§i ro: ${risk}` : 'Rá»§i ro cao';
            badge.className   = 'reason-badge reason-risk';
            msg.textContent   = 'Cháº¿ Ä‘á»™ Kiá»ƒm soĂ¡t gia Ä‘Ă¬nh (Parental Control) Ä‘Ă£ cháº·n trang web nĂ y '
                              + 'vĂ¬ Ä‘iá»ƒm rá»§i ro vÆ°á»£t ngÆ°á»¡ng cho phĂ©p.';
        }

        // â”€â”€ Back button â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        document.getElementById('btnBack').addEventListener('click', () => {
            if (history.length > 1) {
                history.back();
            } else {
                window.close();
            }
        });

        // â”€â”€ PIN unlock (not shown for incognito mode) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        document.getElementById('btnUnlock').addEventListener('click', () => {
            const pin = document.getElementById('pinInput').value;
            chrome.storage.local.get(['parentalPIN'], (data) => {
                const storedPIN = data.parentalPIN || '0000';
                if (pin === storedPIN) {
                    if (!targetUrl) { history.back(); return; }
                    // Temporarily whitelist this URL for the session
                    chrome.storage.local.get(['parentalBypass'], (d) => {
                        const bypassed = d.parentalBypass || [];
                        bypassed.push(targetUrl);
                        chrome.storage.local.set({ parentalBypass: bypassed }, () => {
                            window.location.href = targetUrl;
                        });
                    });
                } else {
                    document.getElementById('pinError').style.display = 'block';
                    document.getElementById('pinInput').value = '';
                    document.getElementById('pinInput').focus();
                }
            });
        });

        document.getElementById('pinInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btnUnlock').click();
        });
    </script>
